name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish. `pages: write` also lets
# configure-pages turn Pages on the first time it runs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a running one — a half-finished deploy
# is worse than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Configure Pages
        id: pages
        # No `enablement: true` here. GITHUB_TOKEN cannot create a Pages site
        # even with `pages: write` — that needs repo admin — so the flag just
        # fails the run with "Resource not accessible by integration". Pages
        # has to be switched on once by hand:
        #   Settings → Pages → Source: GitHub Actions
        # After that this step reads the existing config and everything works.
        uses: actions/configure-pages@v5

      - name: Build
        # A project site is served from /<repo>, so the app needs to know its
        # own prefix. configure-pages hands us the real base_path; strip the
        # trailing slash it sometimes carries. On a custom domain this
        # resolves to empty and the site builds for the root.
        run: |
          BP="${{ steps.pages.outputs.base_path }}"
          BP="${BP%/}"
          echo "Building with base path: '${BP}'"
          NEXT_PUBLIC_BASE_PATH="$BP" npm run build

      - name: Check every asset URL carries the base path
        # basePath bugs are invisible locally — NEXT_PUBLIC_BASE_PATH is empty
        # in dev, so a bare /images/… works there and 404s only once deployed.
        # This is the only place the mistake is observable before a human sees
        # a broken image. next/image with images.unoptimized is the usual
        # culprit: it does not apply basePath, despite next/link doing so.
        run: |
          BP="${{ steps.pages.outputs.base_path }}"
          BP="${BP%/}"
          if [ -z "$BP" ]; then echo "No base path (custom domain) — nothing to check"; exit 0; fi
          if grep -rhoE '(src|href)="/(images|[A-Za-z0-9_]+\.(webp|png|jpe?g|pdf))[^"]*"' out --include='*.html' \
             | grep -v "\"$BP/" | sort -u | tee /tmp/bare.txt | grep -q .; then
            echo "::error::asset URLs missing the '$BP' prefix — these will 404 on the deploy:"
            cat /tmp/bare.txt
            exit 1
          fi
          echo "All asset URLs carry $BP"

      - name: Check the CV actually shipped
        # This is the one link a recruiter clicks. If the export ever stops
        # copying public/, fail here rather than serving a 404.
        run: |
          test -s out/Ivy_Matobori_Resume.pdf
          test -s out/Ivy_Matobori_Resume_OctaviaCarbon_IC.pdf
          echo "CV PDFs present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
